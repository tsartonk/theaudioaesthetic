<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>The Audio Aesthetic</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #000;
      min-height: 100%;
    }

    body {
      overflow-x: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* =========================
       ARTWORK GRID
       ========================= */

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 2px;
      padding: 2px;
    }

    .artwork {
      position: relative;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      cursor: pointer;
      background: #111;
    }

    .artwork img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      transition: transform 0.4s ease, opacity 0.4s ease;
    }

    .artwork:hover img {
      transform: scale(1.03);
      opacity: 0.8;
    }


    /* =========================
       SONG INFO
       ========================= */

    .song-info {
      position: fixed;
      left: 50%;
      bottom: 72px;
      transform: translateX(-50%);

      display: none;

      text-align: center;
      color: white;

      z-index: 10;

      pointer-events: none;
    }

    .song-info.visible {
      display: block;
    }

    .song-title {
      font-size: 13px;
      margin: 0 0 4px;
      font-weight: 400;
    }

    .song-artist {
      font-size: 10px;
      margin: 0;
      color: #777;
    }


    /* =========================
       MINIMAL PLAYER
       ========================= */

    .player {
      position: fixed;

      left: 50%;
      bottom: 22px;

      transform: translateX(-50%);

      display: flex;
      align-items: center;
      justify-content: center;

      gap: 20px;

      z-index: 20;
    }

    .player button {
      border: none;
      background: none;

      color: #fff;

      font-size: 14px;

      cursor: pointer;

      padding: 4px;

      opacity: 0.65;

      transition: opacity 0.2s ease,
                  transform 0.2s ease;
    }

    .player button:hover {
      opacity: 1;
      transform: scale(1.08);
    }

    .play-button {
      font-size: 18px !important;
    }


    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 600px) {

      .grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 2px;
        padding: 2px;
      }

      .player {
        bottom: 18px;
      }

      .song-info {
        bottom: 62px;
      }

    }

  </style>
</head>


<body>


  <!-- =========================
       ARTWORK
       ========================= -->

  <main class="grid" id="musicGrid"></main>


  <!-- =========================
       SONG INFO
       ========================= -->

  <div class="song-info" id="songInfo">

    <p
      class="song-title"
      id="songTitle">
    </p>

    <p
      class="song-artist"
      id="songArtist">
    </p>

  </div>


  <!-- =========================
       MINIMAL PLAYER
       ========================= -->

  <div class="player">

    <button
      id="repeatButton"
      title="Repeat">
      ↻
    </button>

    <button
      id="playButton"
      class="play-button"
      title="Play / Pause">
      ▶
    </button>

  </div>


  <!-- Hidden audio engine -->

  <audio
    id="player"
    preload="metadata">
  </audio>


  <script>


    /* ======================================================
       MUSIC LIBRARY
       ====================================================== */


    const songs = [

      {
        title: "SaveMe",

        artist: "ToNk (ft. Don'o)",

        artwork:
          "https://media.theaudioaesthetic.com/artwork/SaveMe.jpg",

        audio:
          "https://media.theaudioaesthetic.com/music/SaveMe.mp3"
      }

    ];


    /* ======================================================
       SHUFFLE
       ====================================================== */


    const shuffledSongs = [...songs];

    for (
      let i = shuffledSongs.length - 1;
      i > 0;
      i--
    ) {

      const j =
        Math.floor(Math.random() * (i + 1));

      [
        shuffledSongs[i],
        shuffledSongs[j]
      ] =
      [
        shuffledSongs[j],
        shuffledSongs[i]
      ];

    }


    /* ======================================================
       ELEMENTS
       ====================================================== */


    const grid =
      document.getElementById("musicGrid");

    const player =
      document.getElementById("player");

    const playButton =
      document.getElementById("playButton");

    const repeatButton =
      document.getElementById("repeatButton");

    const songInfo =
      document.getElementById("songInfo");

    const songTitle =
      document.getElementById("songTitle");

    const songArtist =
      document.getElementById("songArtist");


    let currentSong = null;


    /* ======================================================
       CREATE ARTWORK
       ====================================================== */


    shuffledSongs.forEach(song => {

      const artwork =
        document.createElement("div");

      artwork.className = "artwork";


      artwork.innerHTML = `

        <img
          src="${song.artwork}"
          alt="${song.title}"
          loading="lazy"
        >

      `;


      /* ================================================
         CLICK ARTWORK
         ================================================ */

      artwork.addEventListener("click", () => {

        currentSong = song;

        player.src = song.audio;

        songTitle.textContent =
          song.title;

        songArtist.textContent =
          song.artist;

        songInfo.classList.add("visible");

        player.play();

        playButton.textContent = "❚❚";

      });


      grid.appendChild(artwork);

    });


    /* ======================================================
       PLAY / PAUSE
       ====================================================== */


    playButton.addEventListener("click", () => {

      if (!currentSong) {
        return;
      }


      if (player.paused) {

        player.play();

        playButton.textContent = "❚❚";

      } else {

        player.pause();

        playButton.textContent = "▶";

      }

    });


    /* ======================================================
       REPEAT
       ====================================================== */


    repeatButton.addEventListener("click", () => {

      player.loop =
        !player.loop;

      repeatButton.style.opacity =
        player.loop ? "1" : "0.65";

    });


    /* ======================================================
       UPDATE PLAY BUTTON
       ====================================================== */


    player.addEventListener("play", () => {

      playButton.textContent = "❚❚";

    });


    player.addEventListener("pause", () => {

      playButton.textContent = "▶";

    });


    /* ======================================================
       WHEN SONG ENDS
       ====================================================== */


    player.addEventListener("ended", () => {

      if (!player.loop) {

        playButton.textContent = "▶";

      }

    });


  </script>

</body>
</html>
