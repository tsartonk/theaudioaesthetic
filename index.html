<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>The Audio Aesthetic</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #000;
      min-height: 100%;
    }

    body {
      overflow-x: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }


    /* =====================================================
       ARTWORK GRID
       ===================================================== */

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 2px;
      padding: 2px;
    }


    .artwork {
      position: relative;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      cursor: pointer;
      background: #111;
    }


    .artwork img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;

      transition:
        transform 0.4s ease,
        opacity 0.4s ease;
    }


    .artwork:hover img {
      transform: scale(1.03);
      opacity: 0.8;
    }


    /* =====================================================
       SONG INFO
       ===================================================== */

    .song-info {
      position: fixed;

      left: 50%;
      bottom: 72px;

      transform: translateX(-50%);

      display: none;

      text-align: center;
      color: white;

      z-index: 10;

      pointer-events: none;

      white-space: nowrap;
    }


    .song-info.visible {
      display: block;
    }


    .song-title {
      font-size: 13px;
      margin: 0 0 4px;
      font-weight: 400;
    }


    .song-artist {
      font-size: 10px;
      margin: 0;
      color: #777;
    }


    /* =====================================================
       MINIMAL PLAYER
       ===================================================== */

    .player {
      position: fixed;

      left: 50%;
      bottom: 22px;

      transform: translateX(-50%);

      display: flex;

      align-items: center;
      justify-content: center;

      gap: 20px;

      z-index: 30;
    }


    .player button {
      border: none;
      background: none;

      color: #fff;

      font-size: 14px;

      cursor: pointer;

      padding: 4px;

      opacity: 0.65;

      transition:
        opacity 0.2s ease,
        transform 0.2s ease;
    }


    .player button:hover {
      opacity: 1;
      transform: scale(1.08);
    }


    .play-button {
      font-size: 18px !important;
    }


    /* =====================================================
       ALBUM OVERLAY
       ===================================================== */

    .album-overlay {
      position: fixed;
      inset: 0;

      background: rgba(0, 0, 0, 0.94);

      z-index: 100;

      display: none;

      align-items: center;
      justify-content: center;

      padding: 30px;
    }


    .album-overlay.visible {
      display: flex;
    }


    /* =====================================================
       ALBUM PANEL
       ===================================================== */

    .album-panel {
      width: 100%;
      max-width: 500px;

      color: white;
    }


    .album-header {
      display: flex;

      align-items: center;

      gap: 18px;

      margin-bottom: 28px;
    }


    .album-cover {
      width: 90px;
      height: 90px;

      object-fit: cover;

      flex-shrink: 0;
    }


    .album-details h2 {
      margin: 0 0 5px;

      font-size: 16px;

      font-weight: 400;
    }


    .album-details p {
      margin: 0;

      font-size: 11px;

      color: #777;
    }


    /* =====================================================
       TRACKLIST
       ===================================================== */

    .tracklist {
      border-top: 1px solid #222;
    }


    .track {
      display: flex;

      align-items: center;

      width: 100%;

      padding: 12px 4px;

      border: none;

      border-bottom: 1px solid #222;

      background: none;

      color: white;

      text-align: left;

      cursor: pointer;

      font-family: inherit;

      transition: opacity 0.2s ease;
    }


    .track:hover {
      opacity: 0.55;
    }


    .track-number {
      width: 35px;

      color: #555;

      font-size: 11px;

      flex-shrink: 0;
    }


    .track-title {
      font-size: 12px;

      flex: 1;
    }


    .track-feature {
      font-size: 10px;

      color: #777;

      margin-left: 10px;

      text-align: right;
    }


    /* =====================================================
       CLOSE BUTTON
       ===================================================== */

    .close-album {
      position: fixed;

      top: 22px;
      right: 26px;

      border: none;

      background: none;

      color: white;

      font-size: 20px;

      cursor: pointer;

      opacity: 0.6;

      z-index: 110;
    }


    .close-album:hover {
      opacity: 1;
    }


    /* =====================================================
       MOBILE
       ===================================================== */

    @media (max-width: 600px) {

      .grid {
        grid-template-columns: repeat(2, 1fr);

        gap: 2px;

        padding: 2px;
      }


      .player {
        bottom: 18px;
      }


      .song-info {
        bottom: 62px;
      }


      .album-overlay {
        padding: 20px;
      }


      .album-cover {
        width: 75px;
        height: 75px;
      }


      .track-feature {
        font-size: 9px;
      }

    }

  </style>
</head>


<body>


  <!-- =====================================================
       ARTWORK GRID
       ===================================================== -->

  <main
    class="grid"
    id="musicGrid">
  </main>


  <!-- =====================================================
       SONG INFORMATION
       ===================================================== -->

  <div
    class="song-info"
    id="songInfo">

    <p
      class="song-title"
      id="songTitle">
    </p>

    <p
      class="song-artist"
      id="songArtist">
    </p>

  </div>


  <!-- =====================================================
       ALBUM TRACKLIST
       ===================================================== -->

  <div
    class="album-overlay"
    id="albumOverlay">

    <button
      class="close-album"
      id="closeAlbum">

      ×

    </button>


    <div class="album-panel">


      <div class="album-header">

        <img
          class="album-cover"
          id="albumCover"
          src=""
          alt=""
        >


        <div class="album-details">

          <h2
            id="albumTitle">
          </h2>


          <p
            id="albumArtist">
          </p>

        </div>

      </div>


      <div
        class="tracklist"
        id="tracklist">
      </div>


    </div>

  </div>


  <!-- =====================================================
       MINIMAL PLAYER
       ===================================================== -->

  <div class="player">

    <button
      id="repeatButton"
      title="Repeat">

      ↻

    </button>


    <button
      id="playButton"
      class="play-button"
      title="Play / Pause">

      ▶

    </button>

  </div>


  <!-- =====================================================
       AUDIO ENGINE
       ===================================================== -->

  <audio
    id="player"
    preload="metadata">
  </audio>


  <script>


    /* =====================================================
       MUSIC LIBRARY
       ===================================================== */

    const library = [


      /* ===================================================
         SINGLE — SaveMe
         =================================================== */

      {
        type: "single",

        title: "Save Me",

        artist: "ToNk",

        features: [Don'o],

        artwork:
          "https://media.theaudioaesthetic.com/artwork/SaveMe.jpg",

        audio:
          "https://media.theaudioaesthetic.com/music/SaveMe.mp3"
      },


      /* ===================================================
         ALBUM — WWF
         =================================================== */

      {
        type: "album",

        title: "WWF",

        artist: "ToNk",

        artwork:
          "https://media.theaudioaesthetic.com/artwork/wwf.jpg",


        tracks: [

          {
            title: "First Down",

            features: [],

            audio:
              "https://media.theaudioaesthetic.com/music/WWF/01.%20ToNk%20-%20FirstDown%20-%20RM2.mp3"
          },


          {
            title: "10 Toes",

            features: [
              "TreyVaro"
            ],

            audio:
              "https://media.theaudioaesthetic.com/music/WWF/02.%20ToNk%20x%20TreyVaro%20-%2010Toes%20-%20RM3.mp3"
          },


          {
            title: "Toe To Toe",

            features: [
              "Don'o"
            ],

            audio:
              "https://media.theaudioaesthetic.com/music/WWF/03.%20ToNk%20x%20Don'o%20-%20ToeToToe%20-%20RM1.mp3"
          },


          {
            title: "Boastin",

            features: [
              "PeriMaison"
            ],

            audio:
              "https://media.theaudioaesthetic.com/music/WWF/04.%20ToNk%20x%20PeriMaison%20-%20Boastin.mp3"
          }

        ]
      },


      /* ===================================================
         SINGLE — Do Our Own Thing
         =================================================== */

      {
        type: "single",

        title: "Do Our Own Thing",

        artist: "Don'o",

        features: [
          "Drain",
          "Jaz"
        ],

        artwork:
          "https://media.theaudioaesthetic.com/artwork/DOOT.jpg",

        audio:
          "https://media.theaudioaesthetic.com/music/RashoudDrain%20x%20Don'O%20-%20DOT%20-%20RM2.mp3"
      },


      /* ===================================================
         SINGLE — Hell Of A Life
         =================================================== */

      {
        type: "single",

        title: "Hell Of A Life",

        artist: "Don'o",

        features: [
          "ToNk"
        ],

        artwork:
          "https://media.theaudioaesthetic.com/artwork/HellOfALife.jpg",

        audio:
          "https://media.theaudioaesthetic.com/music/Don'o%20-%20HellOfALife%20-RM2.mp3"
      },


      /* ===================================================
         SINGLE — GLORY [x2]
         =================================================== */

      {
        type: "single",

        title: "GLORY [x2]",

        artist: "Jaź & Don'o",

        features: [],

        artwork:
          "https://media.theaudioaesthetic.com/artwork/GLORYX2.jpg",

        audio:
          "https://media.theaudioaesthetic.com/music/Jaz%20x%20Don'O%20-%20GloryGlory.mp3"
      },


      /* ===================================================
         SINGLE — Highs & Lows
         =================================================== */

      {
        type: "single",

        title: "Highs & Lows",

        artist: "RETRO REW",

        features: [
          "ToNk"
        ],

        artwork:
          "https://media.theaudioaesthetic.com/artwork/HIGHSANDLOWS.jpg",

        audio:
          "https://media.theaudioaesthetic.com/music/RetroREW%20-%20HIGHS%26LOWS.mp3"
      }

    ];


    /* =====================================================
       SHUFFLE ARTWORK
       ===================================================== */

    const shuffledLibrary =
      [...library];


    for (
      let i = shuffledLibrary.length - 1;
      i > 0;
      i--
    ) {

      const j =
        Math.floor(
          Math.random() * (i + 1)
        );


      [
        shuffledLibrary[i],
        shuffledLibrary[j]
      ] =
      [
        shuffledLibrary[j],
        shuffledLibrary[i]
      ];

    }


    /* =====================================================
       ELEMENTS
       ===================================================== */

    const grid =
      document.getElementById(
        "musicGrid"
      );


    const player =
      document.getElementById(
        "player"
      );


    const playButton =
      document.getElementById(
        "playButton"
      );


    const repeatButton =
      document.getElementById(
        "repeatButton"
      );


    const songInfo =
      document.getElementById(
        "songInfo"
      );


    const songTitle =
      document.getElementById(
        "songTitle"
      );


    const songArtist =
      document.getElementById(
        "songArtist"
      );


    const albumOverlay =
      document.getElementById(
        "albumOverlay"
      );


    const albumCover =
      document.getElementById(
        "albumCover"
      );


    const albumTitle =
      document.getElementById(
        "albumTitle"
      );


    const albumArtist =
      document.getElementById(
        "albumArtist"
      );


    const tracklist =
      document.getElementById(
        "tracklist"
      );


    const closeAlbum =
      document.getElementById(
        "closeAlbum"
      );


    /* =====================================================
       PLAYER STATE
       ===================================================== */

    let currentSong = null;

    let currentAlbum = null;

    let currentTrackIndex = -1;


    /* =====================================================
       FORMAT ARTISTS
       ===================================================== */

    function formatArtists(
      artist,
      features = []
    ) {

      if (
        !features ||
        features.length === 0
      ) {

        return artist;

      }


      return (
        artist +
        " feat. " +
        features.join(", ")
      );

    }


    /* =====================================================
       PLAY SONG
       ===================================================== */

    function playSong(
      title,
      artist,
      audio,
      features = [],
      album = null,
      trackIndex = -1
    ) {

      currentSong = {

        title,
        artist,
        audio,
        features

      };


      currentAlbum =
        album;


      currentTrackIndex =
        trackIndex;


      player.src =
        audio;


      songTitle.textContent =
        title;


      songArtist.textContent =
        formatArtists(
          artist,
          features
        );


      songInfo.classList.add(
        "visible"
      );


      player.play();


      playButton.textContent =
        "❚❚";

    }


    /* =====================================================
       CREATE ARTWORK GRID
       ===================================================== */

    shuffledLibrary.forEach(
      item => {

        const artwork =
          document.createElement(
            "div"
          );


        artwork.className =
          "artwork";


        artwork.innerHTML = `

          <img
            src="${item.artwork}"
            alt="${item.title}"
            loading="lazy"
          >

        `;


        /* =================================================
           SINGLE
           ================================================= */

        if (
          item.type === "single"
        ) {

          artwork.addEventListener(
            "click",
            () => {

              playSong(

                item.title,

                item.artist,

                item.audio,

                item.features

              );

            }
          );

        }


        /* =================================================
           ALBUM
           ================================================= */

        if (
          item.type === "album"
        ) {

          artwork.addEventListener(
            "click",
            () => {

              openAlbum(item);

            }
          );

        }


        grid.appendChild(
          artwork
        );

      }
    );


    /* =====================================================
       OPEN ALBUM
       ===================================================== */

    function openAlbum(
      album
    ) {

      albumCover.src =
        album.artwork;


      albumTitle.textContent =
        album.title;


      albumArtist.textContent =
        album.artist;


      tracklist.innerHTML =
        "";


      album.tracks.forEach(
        (
          track,
          index
        ) => {


          const button =
            document.createElement(
              "button"
            );


          button.className =
            "track";


          const featureText =
            track.features &&
            track.features.length > 0

              ? `feat. ${track.features.join(", ")}`

              : "";


          button.innerHTML = `

            <span
              class="track-number">

              ${String(
                index + 1
              ).padStart(2, "0")}

            </span>


            <span
              class="track-title">

              ${track.title}

            </span>


            <span
              class="track-feature">

              ${featureText}

            </span>

          `;


          button.addEventListener(
            "click",
            () => {

              playSong(

                track.title,

                album.artist,

                track.audio,

                track.features,

                album,

                index

              );


              albumOverlay.classList.remove(
                "visible"
              );

            }
          );


          tracklist.appendChild(
            button
          );

        }
      );


      albumOverlay.classList.add(
        "visible"
      );


      /* =================================================
         START ALBUM AT TRACK 1
         ================================================= */

      const firstTrack =
        album.tracks[0];


      playSong(

        firstTrack.title,

        album.artist,

        firstTrack.audio,

        firstTrack.features,

        album,

        0

      );

    }


    /* =====================================================
       CLOSE ALBUM
       ===================================================== */

    closeAlbum.addEventListener(
      "click",
      () => {

        albumOverlay.classList.remove(
          "visible"
        );

      }
    );


    /* =====================================================
       PLAY / PAUSE
       ===================================================== */

    playButton.addEventListener(
      "click",
      () => {

        if (!currentSong) {

          return;

        }


        if (player.paused) {

          player.play();


          playButton.textContent =
            "❚❚";

        } else {

          player.pause();


          playButton.textContent =
            "▶";

        }

      }
    );


    /* =====================================================
       REPEAT
       ===================================================== */

    repeatButton.addEventListener(
      "click",
      () => {

        player.loop =
          !player.loop;


        repeatButton.style.opacity =
          player.loop
            ? "1"
            : "0.65";

      }
    );


    /* =====================================================
       AUTOMATIC ALBUM PROGRESSION
       ===================================================== */

    player.addEventListener(
      "ended",
      () => {


        /* -----------------------------------------------
           ALBUM PLAYBACK
           ----------------------------------------------- */

        if (
          currentAlbum &&
          currentTrackIndex >= 0
        ) {


          const nextTrackIndex =
            currentTrackIndex + 1;


          /* ---------------------------------------------
             NEXT TRACK
             --------------------------------------------- */

          if (
            nextTrackIndex <
            currentAlbum.tracks.length
          ) {


            const nextTrack =
              currentAlbum.tracks[
                nextTrackIndex
              ];


            playSong(

              nextTrack.title,

              currentAlbum.artist,

              nextTrack.audio,

              nextTrack.features,

              currentAlbum,

              nextTrackIndex

            );


            return;

          }


          /* ---------------------------------------------
             ALBUM FINISHED
             --------------------------------------------- */

          currentAlbum =
            null;


          currentTrackIndex =
            -1;


          playButton.textContent =
            "▶";


          return;

        }


        /* -----------------------------------------------
           SINGLE FINISHED
           ----------------------------------------------- */

        playButton.textContent =
          "▶";

      }
    );


    /* =====================================================
       PLAYER STATE
       ===================================================== */

    player.addEventListener(
      "play",
      () => {

        playButton.textContent =
          "❚❚";

      }
    );


    player.addEventListener(
      "pause",
      () => {

        playButton.textContent =
          "▶";

      }
    );


  </script>

</body>
</html>
