<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Audio Aesthetic</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  background:#000;
  min-height:100%;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  overflow-x:hidden;
}

/* =========================
   GRID
========================= */

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:2px;
  padding:2px;
}

.artwork{
  position:relative;
  aspect-ratio:1/1;
  overflow:hidden;
  cursor:pointer;
  background:#111;
}

.artwork img{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
  transition:transform .4s ease,opacity .4s ease;
}

.artwork:hover img{
  transform:scale(1.03);
  opacity:.8;
}

/* =========================
   SEARCH
========================= */

.search-wrap{
  position:fixed;
  top:18px;
  left:50%;
  transform:translateX(-50%);
  z-index:50;
  width:min(360px,calc(100% - 40px));
  opacity:0;
  pointer-events:none;
  transition:opacity .25s ease;
}

.search-wrap.visible{
  opacity:1;
  pointer-events:auto;
}

.search-input{
  width:100%;
  padding:9px 12px;
  border:1px solid #222;
  border-radius:2px;
  outline:none;
  background:rgba(0,0,0,.92);
  color:#fff;
  font-family:inherit;
  font-size:12px;
}

.search-input::placeholder{
  color:#555;
}

.search-results{
  margin-top:4px;
  max-height:50vh;
  overflow-y:auto;
  background:rgba(0,0,0,.96);
  border:1px solid #181818;
}

.search-result{
  width:100%;
  padding:10px 12px;
  border:0;
  border-bottom:1px solid #181818;
  background:none;
  color:#fff;
  text-align:left;
  cursor:pointer;
  font-family:inherit;
}

.search-result:hover{
  background:#111;
}

.search-result-title{
  display:block;
  font-size:12px;
}

.search-result-artist{
  display:block;
  margin-top:3px;
  color:#666;
  font-size:9px;
}

/* =========================
   TOP BUTTONS
========================= */

.top-button{
  position:fixed;
  top:18px;
  z-index:60;
  border:0;
  background:none;
  color:#fff;
  cursor:pointer;
  opacity:.55;
  transition:opacity .2s ease,transform .2s ease;
  padding:2px;
}

.top-button:hover{
  opacity:1;
  transform:scale(1.08);
}

.search-button{
  right:54px;
  font-size:22px;
  line-height:1;
}

.instagram-button{
  right:20px;
  width:20px;
  height:20px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-decoration:none;
}

.instagram-button svg{
  width:18px;
  height:18px;
  display:block;
}

/* =========================
   PLAYER
========================= */

.player{
  position:fixed;
  left:50%;
  bottom:18px;
  transform:translateX(-50%);
  width:min(560px,calc(100% - 36px));
  z-index:30;
  display:flex;
  flex-direction:column;
  align-items:center;
  pointer-events:none;
}

.waveform-wrap{
  width:100%;
  height:42px;
  margin-bottom:5px;
  cursor:pointer;
  pointer-events:auto;
  position:relative;
}

#waveform{
  width:100%;
  height:100%;
  display:block;
}

.wave-progress{
  position:absolute;
  left:0;
  bottom:-3px;
  height:1px;
  width:0%;
  background:#fff;
  pointer-events:none;
}

.player-controls{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:22px;
  pointer-events:auto;
}

.player button{
  border:0;
  background:none;
  color:#fff;
  font-size:14px;
  cursor:pointer;
  padding:4px;
  opacity:.6;
  transition:opacity .2s ease,transform .2s ease;
}

.player button:hover{
  opacity:1;
  transform:scale(1.08);
}

.play-button{
  font-size:18px!important;
}

.random-active{
  opacity:1!important;
}

/* =========================
   SONG INFO
========================= */

.song-info{
  position:fixed;
  left:50%;
  bottom:100px;
  transform:translateX(-50%);
  display:none;
  text-align:center;
  color:#fff;
  z-index:80;
  pointer-events:none;
  white-space:nowrap;
}

.song-info.visible{
  display:block;
}

.song-title{
  font-size:13px;
  margin:0 0 4px;
  font-weight:400;
}

.song-artist{
  font-size:10px;
  margin:0;
  color:#777;
}

.single-support-button{
  pointer-events:auto;
  cursor:pointer;
  position:relative;
  z-index:81;
}

/* =========================
   ALBUM OVERLAY
========================= */

.album-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.94);
  z-index:100;
  display:none;
  align-items:center;
  justify-content:center;
  padding:30px;
  overflow-y:auto;
}

.album-overlay.visible{
  display:flex;
}

.album-panel{
  width:100%;
  max-width:500px;
  color:#fff;
}

.album-header{
  display:flex;
  align-items:center;
  gap:18px;
  margin-bottom:28px;
}

.album-cover{
  width:90px;
  height:90px;
  object-fit:cover;
  flex-shrink:0;
}

.album-details h2{
  margin:0 0 5px;
  font-size:16px;
  font-weight:400;
}

.album-details p{
  margin:0;
  font-size:11px;
  color:#777;
}

.tracklist{
  border-top:1px solid #222;
}

.track{
  display:flex;
  align-items:center;
  width:100%;
  padding:12px 4px;
  border:0;
  border-bottom:1px solid #222;
  background:none;
  color:#fff;
  text-align:left;
  cursor:pointer;
  font-family:inherit;
  transition:opacity .2s ease;
}

.track:hover{
  opacity:.55;
}

.track.current{
  opacity:1;
}

.track.current .track-title{
  font-weight:600;
}

.track-number{
  width:35px;
  color:#555;
  font-size:11px;
  flex-shrink:0;
}

.track-title{
  font-size:12px;
  flex:1;
}

.track-feature{
  font-size:10px;
  color:#777;
  margin-left:10px;
  text-align:right;
}

.close-album{
  position:fixed;
  top:22px;
  right:26px;
  border:0;
  background:none;
  color:#fff;
  font-size:20px;
  cursor:pointer;
  opacity:.6;
  z-index:110;
}

.close-album:hover{
  opacity:1;
}

/* =========================
   SUPPORT
========================= */

.support-button{
  margin-top:22px;
  display:inline-block;
  color:#777;
  font-size:10px;
  text-decoration:none;
  border-bottom:1px solid #333;
  padding-bottom:3px;
  transition:color .2s ease,border-color .2s ease;
}

.support-button:hover{
  color:#fff;
  border-color:#fff;
}

.support-wrap{
  text-align:center;
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

  .grid{
    grid-template-columns:repeat(2,1fr);
    gap:2px;
    padding:2px;
  }

  .player{
    bottom:14px;
    width:calc(100% - 28px);
  }

  .waveform-wrap{
    height:36px;
  }

  .song-info{
    bottom:82px;
  }

  .song-title{
    font-size:12px;
  }

  .song-artist{
    font-size:9px;
  }

  .player-controls{
    gap:20px;
  }

  .search-button{
    top:14px;
    right:50px;
  }

  .instagram-button{
    top:14px;
    right:15px;
  }

  .search-wrap{
    top:14px;
    width:calc(100% - 32px);
  }

  .album-overlay{
    padding:20px;
  }

  .album-cover{
    width:75px;
    height:75px;
  }

  .track-feature{
    font-size:9px;
  }
}
</style>

/* =========================================================
   ARTIST FORMAT
========================================================= */

function formatArtists(artist,features=[]){

  return features.length
    ? artist+" feat. "+features.join(", ")
    : artist;

}


/* =========================================================
   SUPPORT
========================================================= */

function getSupportArtist(artist){

  if(artist.includes(",")){
    return artist.split(",")[0].trim();
  }

  if(artist.includes(" & ")){
    return artist.split(" & ")[0].trim();
  }

  return artist.trim();

}


function showSupport(artist,enabled=true){

  supportWrap.innerHTML="";

  if(!enabled)return;

  const supportArtist=getSupportArtist(artist);

  const link=artistSupport[supportArtist];

  if(!link)return;

  const button=document.createElement("a");

  button.className="support-button";

  button.href=link;

  button.target="_blank";

  button.rel="noopener noreferrer";

  button.textContent="Support "+supportArtist;

  supportWrap.appendChild(button);

}


/* =========================================================
   FLATTEN LIBRARY
========================================================= */

function getAllTracks(){

  const tracks=[];

  library.forEach(item=>{

    if(item.type==="single"){

      tracks.push({
        title:item.title,
        artist:item.artist,
        features:item.features || [],
        audio:item.audio,
        artwork:item.artwork,
        album:null,
        support:item.support !== false
      });

    }

    else{

      item.tracks.forEach(track=>{

        tracks.push({
          title:track.title,
          artist:item.artist,
          features:track.features || [],
          audio:track.audio,
          artwork:item.artwork,
          album:item,
          support:true
        });

      });

    }

  });

  return tracks;

}


/* =========================================================
   PLAY SONG
========================================================= */

function playSong(
  title,
  artist,
  audio,
  features=[],
  album=null,
  trackIndex=-1,
  artwork=null
){

  currentSong={
    title,
    artist,
    audio,
    features,
    artwork
  };

  currentAlbum=album;
  currentTrackIndex=trackIndex;

  player.src=audio;

  songTitle.textContent=title;

  songArtist.textContent=
    formatArtists(artist,features);

  /* =========================
     SINGLE SUPPORT LINK
  ========================= */

  singleSupport.style.display="none";
  singleSupport.href="";
  singleSupport.textContent="";

  if(!album){

    const libraryItem = library.find(item =>
      item.type === "single" &&
      item.title === title &&
      item.artist === artist
    );

    const supportEnabled =
      !libraryItem ||
      libraryItem.support !== false;

    const supportArtist =
      getSupportArtist(artist);

    const link =
      artistSupport[supportArtist];

    if(supportEnabled && link){

      singleSupport.href = link;

      singleSupport.textContent =
        "Support " + supportArtist;

      singleSupport.style.display =
        "inline-block";

    }

  }

  songInfo.classList.add("visible");

  drawWaveform();

  player.play().catch(()=>{});

  updateTrackHighlight();

}


/* =========================================================
   TRACK HIGHLIGHT
========================================================= */

function updateTrackHighlight(){

  tracklist.querySelectorAll(".track").forEach(track=>{

    track.classList.toggle(
      "current",
      currentAlbum &&
      Number(track.dataset.index)===currentTrackIndex
    );

  });

}


/* =========================================================
   OPEN ALBUM
========================================================= */

function openAlbum(album){

  albumCover.src=album.artwork;

  albumTitle.textContent=album.title;

  albumArtist.textContent=album.artist;

  tracklist.innerHTML="";

  album.tracks.forEach((track,index)=>{

    const button=document.createElement("button");

    button.className="track";

    button.dataset.index=index;

    const featureText=track.features.length
      ? "feat. "+track.features.join(", ")
      : "";

    button.innerHTML=`

      <span class="track-number">
        ${String(index+1).padStart(2,"0")}
      </span>

      <span class="track-title">
        ${track.title}
      </span>

      <span class="track-feature">
        ${featureText}
      </span>

    `;

    button.addEventListener("click",()=>{

      playSong(
        track.title,
        album.artist,
        track.audio,
        track.features,
        album,
        index,
        album.artwork
      );

    });

    tracklist.appendChild(button);

  });


  const sameAlbum=
    currentAlbum===album &&
    currentSong!==null;


  if(!sameAlbum){

    const first=album.tracks[0];

    playSong(
      first.title,
      album.artist,
      first.audio,
      first.features,
      album,
      0,
      album.artwork
    );

  }


  showSupport(album.artist,true);

  albumOverlay.classList.add("visible");

  updateTrackHighlight();

}


/* =========================================================
   RANDOM ALL
========================================================= */

function shuffleArray(array){

  const shuffled=[...array];

  for(
    let i=shuffled.length-1;
    i>0;
    i--
  ){

    const j=
      Math.floor(
        Math.random()*(i+1)
      );

    [
      shuffled[i],
      shuffled[j]
    ]=[
      shuffled[j],
      shuffled[i]
    ];

  }

  return shuffled;

}


function startRandomAll(){

  randomQueue=
    shuffleArray(
      getAllTracks()
    );

  randomIndex=0;

  randomButton.classList.add("random-active");

  playRandomTrack();

}


function playRandomTrack(){

  if(
    randomIndex<0 ||
    randomIndex>=randomQueue.length
  ){

    randomButton.classList.remove(
      "random-active"
    );

    return;

  }

  const track=
    randomQueue[randomIndex];

  playSong(
    track.title,
    track.artist,
    track.audio,
    track.features,
    track.album,
    track.album
      ? track.album.tracks.findIndex(
          t=>t.audio===track.audio
        )
      : -1,
    track.artwork
  );

}

/* =========================================================
   SONG ENDED
========================================================= */

player.addEventListener(
  "ended",
  ()=>{

    if(repeatMode)return;


    /* RANDOM ALL QUEUE */

    if(
      randomQueue.length &&
      randomIndex>=0
    ){

      randomIndex++;

      if(
        randomIndex<
        randomQueue.length
      ){

        playRandomTrack();

        return;

      }

      randomQueue=[];
      randomIndex=-1;

      randomButton.classList.remove(
        "random-active"
      );

      return;

    }


    /* NORMAL ALBUM PLAYBACK */

    if(
      currentAlbum &&
      currentTrackIndex>=0
    ){

      const nextIndex=
        currentTrackIndex+1;


      if(
        nextIndex<
        currentAlbum.tracks.length
      ){

        const next=
          currentAlbum.tracks[nextIndex];

        playSong(
          next.title,
          currentAlbum.artist,
          next.audio,
          next.features,
          currentAlbum,
          nextIndex,
          currentAlbum.artwork
        );

        return;

      }


      currentAlbum=null;

      currentTrackIndex=-1;

      updateTrackHighlight();

    }

  }
);


/* =========================================================
   WAVEFORM
========================================================= */

function resizeWaveform(){

  const rect=
    waveform.getBoundingClientRect();

  const dpr=
    window.devicePixelRatio || 1;

  waveform.width=
    rect.width*dpr;

  waveform.height=
    rect.height*dpr;

  ctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );

  drawWaveform();

}


function drawWaveform(){

  const width=
    waveform.clientWidth;

  const height=
    waveform.clientHeight;

  if(!width || !height)return;


  ctx.clearRect(
    0,
    0,
    width,
    height
  );


  const bars=
    Math.floor(width/4);

  const center=
    height/2;

  const progress=
    player.duration
      ? player.currentTime/
        player.duration
      : 0;


  for(let i=0;i<bars;i++){

    const wave=
      Math.abs(
        Math.sin(i*12.9898)*43758.5453
      )%1;

    const secondary=
      Math.abs(
        Math.sin(i*4.123)*9271.123
      )%1;

    const amplitude=
      5+
      (wave*.55+
      secondary*.45)*
      23;

    const x=i*4;

    const barHeight=
      Math.max(
        2,
        amplitude
      );


    const played=
      x/width<=progress;


    ctx.fillStyle=
      played
        ? "#fff"
        : "#333";


    ctx.fillRect(
      x,
      center-barHeight/2,
      2,
      barHeight
    );

  }

}


waveformWrap.addEventListener(
  "click",
  event=>{

    if(!player.duration)return;

    const rect=
      waveformWrap.getBoundingClientRect();

    const position=
      (event.clientX-rect.left)/
      rect.width;

    player.currentTime=
      position*
      player.duration;

  }
);


window.addEventListener(
  "resize",
  resizeWaveform
);

resizeWaveform();


/* =========================================================
   SEARCH
========================================================= */

function searchLibrary(query){

  const q=
    query
      .trim()
      .toLowerCase();

  searchResults.innerHTML="";

  if(!q)return;


  const results=[];

  library.forEach(item=>{

    if(item.type==="single"){

      const searchable=
        (
          item.title+
          " "+
          item.artist+
          " "+
          (item.features||[]).join(" ")
        ).toLowerCase();


      if(searchable.includes(q)){

        results.push({

          title:item.title,
          artist:item.artist,
          features:item.features||[],
          audio:item.audio,
          artwork:item.artwork,
          album:null

        });

      }

    }

    else{

      item.tracks.forEach(
        (track,index)=>{

          const searchable=
            (
              track.title+
              " "+
              item.artist+
              " "+
              track.features.join(" ")+
              " "+
              item.title
            ).toLowerCase();


          if(searchable.includes(q)){

            results.push({

              title:track.title,
              artist:item.artist,
              features:track.features,
              audio:track.audio,
              artwork:item.artwork,
              album:item,
              index:index

            });

          }

        }
      );

    }

  });


  if(!results.length){

    searchResults.innerHTML=`

      <div style="
        padding:12px;
        color:#555;
        font-size:11px;
      ">
        No results
      </div>

    `;

    return;

  }


  results.forEach(result=>{

    const button=
      document.createElement("button");

    button.className=
      "search-result";


    button.innerHTML=`

      <span class="search-result-title">
        ${result.title}
      </span>

      <span class="search-result-artist">
        ${formatArtists(
          result.artist,
          result.features
        )}
      </span>

    `;


    button.addEventListener(
      "click",
      ()=>{

        playSong(
          result.title,
          result.artist,
          result.audio,
          result.features,
          result.album,
          result.album
            ? result.index
            : -1,
          result.artwork
        );

        searchWrap.classList.remove(
          "visible"
        );

        searchInput.value="";

        searchResults.innerHTML="";

      }
    );


    searchResults.appendChild(button);

  });

}


searchInput.addEventListener(
  "input",
  ()=>{

    searchLibrary(
      searchInput.value
    );

  }
);


/* =========================================================
   SEARCH TOGGLE
========================================================= */

searchButton.addEventListener(
  "click",
  ()=>{

    const visible=
      searchWrap.classList.contains(
        "visible"
      );


    if(visible){

      searchWrap.classList.remove(
        "visible"
      );

      searchInput.value="";

      searchResults.innerHTML="";

    }

    else{

      searchWrap.classList.add(
        "visible"
      );

      setTimeout(
        ()=>searchInput.focus(),
        50
      );

    }

  }
);


/* =========================================================
   ESCAPE SEARCH / ALBUM
========================================================= */

document.addEventListener(
  "keydown",
  event=>{

    if(event.key==="Escape"){

      searchWrap.classList.remove(
        "visible"
      );

      albumOverlay.classList.remove(
        "visible"
      );

    }

  }
);


/* =========================================================
   CLOSE ALBUM
========================================================= */

closeAlbum.addEventListener(
  "click",
  ()=>{

    albumOverlay.classList.remove(
      "visible"
    );

  }
);

</script>

</body>
</html>
