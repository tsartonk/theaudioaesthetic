<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>The Audio Aesthetic</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #000;
      min-height: 100%;
    }

    body {
      overflow-x: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* Artwork grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 2px;
      padding: 2px;
    }

    .artwork {
      position: relative;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      cursor: pointer;
      background: #111;
    }

    .artwork img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      transition: transform 0.4s ease, opacity 0.4s ease;
    }

    .artwork:hover img {
      transform: scale(1.03);
      opacity: 0.8;
    }

    /* Current song information */
    .song-info {
      position: fixed;
      left: 24px;
      bottom: 90px;
      z-index: 10;

      display: none;

      color: white;
      background: rgba(0, 0, 0, 0.85);
      padding: 14px 18px;

      max-width: 300px;
    }

    .song-info.visible {
      display: block;
    }

    .song-title {
      font-size: 16px;
      margin: 0 0 4px;
      font-weight: 400;
    }

    .song-artist {
      font-size: 12px;
      margin: 0;
      color: #999;
    }

    /* Audio player */
    audio {
      position: fixed;
      left: 0;
      bottom: 0;

      width: 100%;
      z-index: 20;
    }

    /* Mobile */
    @media (max-width: 600px) {

      .grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 2px;
        padding: 2px;
      }

      .song-info {
        left: 12px;
        bottom: 80px;
        max-width: calc(100% - 24px);
      }
    }
  </style>
</head>

<body>

  <!-- Artwork -->
  <main class="grid" id="musicGrid"></main>

  <!-- Song information -->
  <div class="song-info" id="songInfo">
    <p class="song-title" id="songTitle"></p>
    <p class="song-artist" id="songArtist"></p>
  </div>

  <!-- Music player -->
  <audio id="player" controls></audio>


  <script>

    /*
    ==========================================================
    THE AUDIO AESTHETIC — MUSIC LIBRARY
    ==========================================================

    Add every song here.

    Example:

    {
      title: "Song Name",
      artist: "Artist Name",
      artwork: "https://media.theaudioaesthetic.com/artwork/SongName.jpg",
      audio: "https://media.theaudioaesthetic.com/music/SongName.mp3"
    }

    ==========================================================
    */


    const songs = [

      {
        title: "SaveMe",
        artist: "YOUR ARTIST NAME",
        artwork: "https://media.theaudioaesthetic.com/artwork/SaveMe.jpg",
        audio: "https://media.theaudioaesthetic.com/music/SaveMe.mp3"
      }

    ];


    /*
    ==========================================================
    SHUFFLE
    ==========================================================
    */

    const shuffledSongs = [...songs];

    for (let i = shuffledSongs.length - 1; i > 0; i--) {

      const j = Math.floor(Math.random() * (i + 1));

      [shuffledSongs[i], shuffledSongs[j]] =
      [shuffledSongs[j], shuffledSongs[i]];

    }


    /*
    ==========================================================
    ELEMENTS
    ==========================================================
    */

    const grid = document.getElementById("musicGrid");

    const player = document.getElementById("player");

    const songInfo = document.getElementById("songInfo");

    const songTitle = document.getElementById("songTitle");

    const songArtist = document.getElementById("songArtist");


    /*
    ==========================================================
    CREATE ARTWORK
    ==========================================================
    */

    shuffledSongs.forEach(song => {

      const artwork = document.createElement("div");

      artwork.className = "artwork";


      artwork.innerHTML = `
        <img
          src="${song.artwork}"
          alt="${song.title}"
          loading="lazy"
        >
      `;


      /*
      ========================================================
      CLICK ARTWORK
      ========================================================
      */

      artwork.addEventListener("click", () => {

        player.src = song.audio;

        songTitle.textContent = song.title;

        songArtist.textContent = song.artist;

        songInfo.classList.add("visible");

        player.play();

      });


      grid.appendChild(artwork);

    });

  </script>

</body>
</html>
