<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Audio Aesthetic</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#000;min-height:100%;font-family:Arial,Helvetica,sans-serif}
body{overflow-x:hidden}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:2px;padding:2px}
.artwork{position:relative;aspect-ratio:1/1;overflow:hidden;cursor:pointer;background:#111}
.artwork img{width:100%;height:100%;display:block;object-fit:cover;transition:transform .4s ease,opacity .4s ease}
.artwork:hover img{transform:scale(1.03);opacity:.8}
.song-info{position:fixed;left:50%;bottom:72px;transform:translateX(-50%);display:none;text-align:center;color:#fff;z-index:10;pointer-events:none;white-space:nowrap}
.song-info.visible{display:block}
.song-title{font-size:13px;margin:0 0 4px;font-weight:400}
.song-artist{font-size:10px;margin:0;color:#777}
.player{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;align-items:center;justify-content:center;gap:20px;z-index:30}
.player button{border:0;background:none;color:#fff;font-size:14px;cursor:pointer;padding:4px;opacity:.65;transition:opacity .2s ease,transform .2s ease}
.player button:hover{opacity:1;transform:scale(1.08)}
.play-button{font-size:18px!important}
.album-overlay{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:100;display:none;align-items:center;justify-content:center;padding:30px;overflow-y:auto}
.album-overlay.visible{display:flex}
.album-panel{width:100%;max-width:500px;color:#fff}
.album-header{display:flex;align-items:center;gap:18px;margin-bottom:28px}
.album-cover{width:90px;height:90px;object-fit:cover;flex-shrink:0}
.album-details h2{margin:0 0 5px;font-size:16px;font-weight:400}
.album-details p{margin:0;font-size:11px;color:#777}
.tracklist{border-top:1px solid #222}
.track{display:flex;align-items:center;width:100%;padding:12px 4px;border:0;border-bottom:1px solid #222;background:none;color:#fff;text-align:left;cursor:pointer;font-family:inherit;transition:opacity .2s ease}
.track:hover{opacity:.55}
.track.current{opacity:1}
.track.current .track-title{font-weight:600}
.track-number{width:35px;color:#555;font-size:11px;flex-shrink:0}
.track-title{font-size:12px;flex:1}
.track-feature{font-size:10px;color:#777;margin-left:10px;text-align:right}
.close-album{position:fixed;top:22px;right:26px;border:0;background:none;color:#fff;font-size:20px;cursor:pointer;opacity:.6;z-index:110}
.close-album:hover{opacity:1}
@media(max-width:600px){
.grid{grid-template-columns:repeat(2,1fr);gap:2px;padding:2px}
.player{bottom:18px}.song-info{bottom:62px}.album-overlay{padding:20px}
.album-cover{width:75px;height:75px}.track-feature{font-size:9px}
}
</style>
</head>
<body>

<main class="grid" id="musicGrid"></main>

<div class="song-info" id="songInfo">
  <p class="song-title" id="songTitle"></p>
  <p class="song-artist" id="songArtist"></p>
</div>

<div class="album-overlay" id="albumOverlay">
  <button class="close-album" id="closeAlbum">×</button>
  <div class="album-panel">
    <div class="album-header">
      <img class="album-cover" id="albumCover" src="" alt="">
      <div class="album-details">
        <h2 id="albumTitle"></h2>
        <p id="albumArtist"></p>
      </div>
    </div>
    <div class="tracklist" id="tracklist"></div>
  </div>
</div>

<div class="player">
  <button id="repeatButton" title="Repeat">↻</button>
  <button id="playButton" class="play-button" title="Play / Pause">▶</button>
</div>

const grid=document.getElementById("musicGrid");
const player=document.createElement("audio");
player.preload="metadata";
document.body.appendChild(player);

const playButton=document.getElementById("playButton");
const repeatButton=document.getElementById("repeatButton");
const songInfo=document.getElementById("songInfo");
const songTitle=document.getElementById("songTitle");
const songArtist=document.getElementById("songArtist");
const albumOverlay=document.getElementById("albumOverlay");
const albumCover=document.getElementById("albumCover");
const albumTitle=document.getElementById("albumTitle");
const albumArtist=document.getElementById("albumArtist");
const tracklist=document.getElementById("tracklist");
const closeAlbum=document.getElementById("closeAlbum");

let currentSong=null;
let currentAlbum=null;
let currentTrackIndex=-1;

function formatArtists(artist,features=[]){
  return features.length ? artist+" feat. "+features.join(", ") : artist;
}

function playSong(title,artist,audio,features=[],album=null,trackIndex=-1){
  currentSong={title,artist,audio,features};
  currentAlbum=album;
  currentTrackIndex=trackIndex;
  player.src=audio;
  songTitle.textContent=title;
  songArtist.textContent=formatArtists(artist,features);
  songInfo.classList.add("visible");
  player.play().catch(()=>{});
  updateTrackHighlight();
}

function updateTrackHighlight(){
  tracklist.querySelectorAll(".track").forEach(track=>{
    track.classList.toggle("current",
      currentAlbum &&
      Number(track.dataset.index)===currentTrackIndex
    );
  });
}

function openAlbum(album){
  albumCover.src=album.artwork;
  albumTitle.textContent=album.title;
  albumArtist.textContent=album.artist;
  tracklist.innerHTML="";

  album.tracks.forEach((track,index)=>{
    const button=document.createElement("button");
    button.className="track";
    button.dataset.index=index;

    const featureText=track.features.length
      ? "feat. "+track.features.join(", ")
      : "";

    button.innerHTML=`
      <span class="track-number">${String(index+1).padStart(2,"0")}</span>
      <span class="track-title">${track.title}</span>
      <span class="track-feature">${featureText}</span>
    `;

    button.addEventListener("click",()=>{
      playSong(track.title,album.artist,track.audio,track.features,album,index);
    });

    tracklist.appendChild(button);
  });

  const sameAlbum=currentAlbum===album && currentSong!==null;

  if(!sameAlbum){
    const first=album.tracks[0];
    playSong(first.title,album.artist,first.audio,first.features,album,0);
  }

  albumOverlay.classList.add("visible");
  updateTrackHighlight();
}

const shuffled=[...library];
for(let i=shuffled.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1));
  [shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]];
}

shuffled.forEach(item=>{
  const artwork=document.createElement("div");
  artwork.className="artwork";
  artwork.innerHTML=`<img src="${item.artwork}" alt="${item.title}" loading="lazy">`;

  artwork.addEventListener("click",()=>{
    if(item.type==="album") openAlbum(item);
    else playSong(item.title,item.artist,item.audio,item.features);
  });

  grid.appendChild(artwork);
});

closeAlbum.addEventListener("click",()=>{
  albumOverlay.classList.remove("visible");
});

playButton.addEventListener("click",()=>{
  if(!currentSong)return;
  if(player.paused) player.play().catch(()=>{});
  else player.pause();
});

repeatButton.addEventListener("click",()=>{
  player.loop=!player.loop;
  repeatButton.style.opacity=player.loop?"1":".65";
});

player.addEventListener("play",()=>playButton.textContent="❚❚");
player.addEventListener("pause",()=>playButton.textContent="▶");

player.addEventListener("ended",()=>{
  if(player.loop)return;

  if(currentAlbum && currentTrackIndex>=0){
    const nextIndex=currentTrackIndex+1;

    if(nextIndex<currentAlbum.tracks.length){
      const next=currentAlbum.tracks[nextIndex];
      playSong(
        next.title,
        currentAlbum.artist,
        next.audio,
        next.features,
        currentAlbum,
        nextIndex
      );
      return;
    }

    currentAlbum=null;
    currentTrackIndex=-1;
    updateTrackHighlight();
  }
});
